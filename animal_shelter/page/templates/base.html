<!DOCTYPE html>
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="//maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/cf3bdf92c0.js"
        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" type="image/png"
        href="{% static 'images/icon.png' %}">
    <link rel="stylesheet" type="text/css" href="/static/css/light_styles.css"
        id="theme">
    <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
        crossorigin="anonymous">
</head>
<body>
    <div class="content-wrapper">
        <header>
            <nav class="navbar">
                <img id="icon_image"
                    src="{% static 'images/icon.png' alt='logotip' align='right'%}"
                    style="border-radius: 30%">
                <div class="topnav_buttons" style="margin-left: 5%;">
                    <a href="/">Главная</a>
                    <a href="/news">Новости</a>
                    <a href="/pets">Выбери друга</a>
                    <a href="/volunteering">Стань волонтёром</a>
                </div>
                <a id="switchMode" class="switch_button"
                    style="color:rgb(255, 255, 255);">Theme</a>
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <footer>
        <div>2023-... ©Официальный сайт приюта для животных "Дом надежды"
        </div>
        <div style="font-size: 20px; font-weight: 400; padding-top:10px;">Разработчик Гареев Булат, волонтёр.</div>
        <div style="font-weight: 400;">г. Уфа</div>
        <div>Контакты: 89867094886</div>
    </footer>
    <script src="{% static 'js/switcher.js' %}"></script>
</body>
