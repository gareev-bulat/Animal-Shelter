{% extends "base.html" %}
{% load static %}
{% block content %}

<header class="back_title"><h2>Выбери друга</h2></header>



<section style="padding: 40px;">
    <div class="row">
        {% for pet in pets %}
        <div class="col-md-4" style="padding-bottom: 20px;">
            <a href="{% url 'pet_detail' pet.pk %}" style="text-decoration: none;">
                <div class="shadow-lg" style="height: 600px;">
                    <img class="card-img-top" src="{{ pet.photo.url }}"
                        alt="{{ pet.name }}"
                        style="height: 500px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" style="color: black; font-size: 30px;">{{ pet.name }}</h5>
                    </div>
                </div>
            </a>
        </div>
        {% if forloop.counter|divisibleby:3 %}
        <div class="w-100"></div>
        {% endif %}
        {% endfor %}
    </div>
</section>

{% endblock %}
