{% extends "base.html" %}


{% block content %}

<header class="back_title"><h2>Новости</h2></header>


<div class="parent">
{% for item in news %}
    <div class="child">
        <h3>{{ item.title }}</h3> <p align="right">{{ item.date }}</p>
        <img id=img src="{{ item.image.url }}" alt="{{item.title}}">
        <p>{{ item.description }}</p>

    </div>
{% endfor %}
</div>
{% endblock %}
