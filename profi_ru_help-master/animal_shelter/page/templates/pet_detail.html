{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-4 mb-4">
  <div class="row">
    <div class="col-md-4">
      <img class="card-img-top" src="{{ animal.photo.url }}"
        alt="{{ animal.name }}" style="height: 500px; object-fit: cover;">
    </div>
    <div class="col-md-8">
      <h1>{{ animal.name }}</h1>
      <p class="card-text" style="max-width: 100%; overflow-wrap: break-word;">{{ animal.description }}</p>
    </div>
  </div>
</div>
{% endblock %}
